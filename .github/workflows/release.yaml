name: release

on:
  push:
    tags:
    - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - uses: actions/setup-go@v6
      with:
        go-version-file: go.mod
        cache: true
    - name: Test
      run: go test ./...
    - uses: goreleaser/goreleaser-action@v6
      with:
        version: "~> v2"
        # Every binary links all cloud SDKs; two at a time fit in the
        # runner's memory.
        args: release --clean --parallelism 2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
